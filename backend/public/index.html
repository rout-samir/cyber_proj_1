
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleSecScan - Cloudflare Edition</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-4">
        <h1 class="text-3xl font-bold text-center my-8">SimpleSecScan</h1>
        <div class="bg-white rounded-lg shadow-lg p-8 max-w-md mx-auto">
            <h2 class="text-2xl font-bold mb-4">Upload a file for vulnerability analysis</h2>
            <form id="upload-form">
                <div class="mb-4">
                    <label for="file-upload" class="block text-gray-700 text-sm font-bold mb-2">Choose a file:</label>
                    <input type="file" id="file-upload" name="file-upload" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                </div>
                <div class="flex items-center justify-between">
                    <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
                        Scan File
                    </button>
                </div>
            </form>
        </div>
        <div id="results-container" class="mt-8"></div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
